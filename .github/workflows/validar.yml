name: validar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: git de teste
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: links dos docs
        run: node scripts/validar-links.mjs
      - name: testes do kit
        run: bash scripts/testes/testar-kit.sh
      - name: testes do fluxo
        run: bash scripts/testes/testar-fluxo.sh
      - name: testes do revisor
        run: bash scripts/testes/testar-revisor.sh
